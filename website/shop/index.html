  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      overflow-x: hidden;
    }
    .shop-hero {
      width: 100vw;
      height: 100vh;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1;
    }
    /* Eyebrow matches the site-wide tier-1 style (see section-headers.css).
       The title below keeps its bespoke shimmer — this is a standalone
       coming-soon splash, not a section header. */
    .shop__eyebrow {
      font-family: var(--font-body);
      font-size: var(--sh-eyebrow);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: var(--sh-eyebrow-track);
      line-height: 1.4;
      opacity: 0;
      color: var(--color-accent);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }
    .shop__title {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 8rem);
      line-height: 1.1;
      padding-bottom: 0.1em;
      margin: 1rem 0;
      font-style: italic;
      color: var(--color-text); /* Fallback */
      
      /* Premium Shimmer Effect */
      background: linear-gradient(
        110deg,
        var(--color-text) 30%,
        var(--color-accent) 50%,
        var(--color-text) 70%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      
      opacity: 0;
      animation: 
        fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards,
        shimmer 5s linear infinite;
    }
    .shop__desc {
      font-family: var(--font-body);
      font-size: 1.4rem;
      line-height: 1.6;
      max-width: 600px;
      color: var(--color-text-dim);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
      padding: 0 1.5rem;
    }
    .shop__btn-wrap {
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    
    .nav {
      background: transparent !important;
      backdrop-filter: none;
      border-bottom: none !important;
    }

    /* Additional helper for the preloader text so we can stack Amour Affairs and The Shop cleanly */
    .preloader__text-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

  
    .floating-whatsapp{position:fixed;bottom:30px;left:30px;width:60px;height:60px;background:linear-gradient(135deg,#C9A97C 0%,#9E7A4E 100%);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(158,122,78,.35),inset 0 2px 4px rgba(255,255,255,.2);z-index:9999;text-decoration:none;transition:transform .4s cubic-bezier(.175,.885,.32,1.275),box-shadow .4s ease}

    .floating-whatsapp svg{fill:currentColor;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}

    @keyframes wa-pulse{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}
    @media(max-width:768px){.floating-whatsapp{bottom:20px;left:20px;width:54px;height:54px}.floating-whatsapp svg{width:28px;height:28px}}
